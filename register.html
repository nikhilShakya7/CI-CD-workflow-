<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - QA Practice Store</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <div class="header-inner">
        <a href="index.html" class="logo">QA Practice Store</a>

        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav id="main-nav">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>
          <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
          <a href="login.html" id="auth-link">Login</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <div class="auth-container">
        <h2>Create Account</h2>
        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="reg-name">Full Name</label>
            <input
              id="reg-name"
              type="text"
              placeholder="John Doe"
              required
            />
            <span class="error-message" id="reg-name-error"></span>
          </div>

          <div class="form-group">
            <label for="reg-email">Email</label>
            <input
              id="reg-email"
              type="email"
              placeholder="john@example.com"
              required
            />
            <span class="error-message" id="reg-email-error"></span>
          </div>

          <div class="form-group">
            <label for="reg-password">Password</label>
            <input
              id="reg-password"
              type="password"
              placeholder="Min 8 characters"
              required
            />
            <span class="error-message" id="reg-password-error"></span>
          </div>

          <div class="form-group">
            <label for="reg-password-confirm">Confirm Password</label>
            <input
              id="reg-password-confirm"
              type="password"
              placeholder="Re-enter password"
              required
            />
            <span class="error-message" id="reg-password-confirm-error"></span>
          </div>

          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" id="agree-terms" required />
              I agree to the Terms and Conditions
            </label>
            <span class="error-message" id="agree-terms-error"></span>
          </div>

          <button type="submit" class="button">Create Account</button>
        </form>

        <p class="auth-switch">
          Already have an account? <a href="login.html">Login here</a>
        </p>
      </div>
    </main>

    <footer>
      <p>QA Practice Store &copy; 2026</p>
    </footer>

    <div id="toast-container"></div>
    <script src="products-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
